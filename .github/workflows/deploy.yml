name: Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy only uses SSH secrets, so the GitHub token can stay read-only.
permissions:
  contents: read

# One deploy at a time. A newer push waits instead of racing the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync server submodule
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Host key check. Add the secret (SHA256 fingerprint of the server's
          # host key) to turn it on; while it's unset the check is skipped.
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            set -e
            cd ~/personal/GoPort
            git pull --ff-only origin main
            git submodule sync -- server
            git submodule update --init --remote server
            docker rm -f goport-server || true
